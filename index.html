    <!-- Typing Message Overlay -->
    <div id="typing-message">

    </div>

    <!-- Typing Effect Script -->
    <script>
      (function() {
        const message = "Estoy muy orgulloso de ti, hermosa. Te mereces todo por lo que has trabajado.";
        const typingElement = document.getElementById('typed-text');
        const messageBox = document.getElementById('typing-message');
        let hasTriggered = false;
        let charIndex = 0;

        function typeCharacter() {
          if (charIndex < message.length) {
            typingElement.textContent += message.charAt(charIndex);
            charIndex++;
            setTimeout(typeCharacter, 50);
          } else {
            // Add heart after typing completes
            setTimeout(() => {
              const heart = document.createElement('span');
              heart.className = 'heart';
              heart.innerHTML = ' ❤️';
              typingElement.appendChild(heart);

              // Hide after 5 seconds
              setTimeout(() => {
                messageBox.classList.remove('visible');
              }, 5000);
            }, 500);
          }
        }

        function checkScroll() {
          if (hasTriggered) return;

          // Trigger after scrolling 100px
          if (window.scrollY > 100) {
            hasTriggered = true;
            messageBox.classList.add('visible');
            setTimeout(typeCharacter, 500);
            window.removeEventListener('scroll', checkScroll);
          }
        }

        window.addEventListener('scroll', checkScroll);
      })();
    </script>

    <!-- Formspree Integration -->
    <script>
      // Wait for React app to load, then modify the contact form
      document.addEventListener('DOMContentLoaded', function() {
        const checkForm = setInterval(function() {
          const form = document.querySelector('form');
          if (form && !form.hasAttribute('data-formspree-modified')) {
            form.setAttribute('data-formspree-modified', 'true');

            // Intercept submit button click instead of form submit
            const submitBtn = form.querySelector('button[type="submit"]');
            if (submitBtn) {
              submitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();

                const formData = new FormData(form);
                const originalText = submitBtn.textContent;

                submitBtn.disabled = true;
                submitBtn.textContent = 'Enviando...';

                fetch('https://formspree.io/f/mqekbekq', {
                  method: 'POST',
                  body: JSON.stringify(Object.fromEntries(formData)),
                  headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                  }
                })
                .then(response => {
                  if (response.ok) {
                    // Clear form fields manually
                    form.querySelectorAll('input, textarea').forEach(el => {
                      el.value = '';
                    });
                    alert('¡Gracias! Su mensaje ha sido enviado.');
                  } else {
                    alert('Error al enviar. Por favor intente de nuevo.');
                  }
                })
                .catch(error => {
                  alert('Error al enviar. Por favor intente de nuevo.');
                })
                .finally(() => {
                  submitBtn.disabled = false;
                  submitBtn.textContent = originalText;
                });

                return false;
              }, true);
            }

            clearInterval(checkForm);
          }
        }, 500);

        setTimeout(() => clearInterval(checkForm), 10000);
      });
    </script>
