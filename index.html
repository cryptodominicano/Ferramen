    <!-- Typing Effect for Hero Text -->
    <script>
      (function() {
        const targetText = "Integrales para tu Negocio";
        let hasTriggered = false;

        function initTypingEffect() {
          // Find all text nodes containing the target phrase
          const walker = document.createTreeWalker(
            document.body,
            NodeFilter.SHOW_TEXT,
            null,
            false
          );

          let node;
          while (node = walker.nextNode()) {
            if (node.textContent.includes(targetText)) {
              const parent = node.parentNode;

              // Skip if already processed
              if (parent.classList && parent.classList.contains('typing-container')) continue;

              // Create wrapper span
              const wrapper = document.createElement('span');
              wrapper.className = 'typing-container';

              // Split text around target
              const parts = node.textContent.split(targetText);

              // Create typing span (initially empty)
              const typingSpan = document.createElement('span');
              typingSpan.className = 'typing-text';
              typingSpan.setAttribute('data-text', targetText);

              // Build new content
              if (parts[0]) wrapper.appendChild(document.createTextNode(parts[0]));
              wrapper.appendChild(typingSpan);
              if (parts[1]) wrapper.appendChild(document.createTextNode(parts[1]));

              // Replace original node
              parent.replaceChild(wrapper, node);

              // Start typing animation
              typeText(typingSpan, targetText);
              return true;
            }
          }
          return false;
        }

        function typeText(element, text) {
          let charIndex = 0;

          // Add cursor
          const cursor = document.createElement('span');
          cursor.className = 'cursor';
          element.appendChild(cursor);

          function typeChar() {
            if (charIndex < text.length) {
              // Insert character before cursor
              const charNode = document.createTextNode(text.charAt(charIndex));
              element.insertBefore(charNode, cursor);
              charIndex++;
              setTimeout(typeChar, 60);
            } else {
              // Remove cursor after typing complete
              setTimeout(() => {
                cursor.remove();
              }, 1500);
            }
          }

          typeChar();
        }

        function checkScroll() {
          if (hasTriggered) return;

          // Trigger after scrolling 50px
          if (window.scrollY > 50) {
            hasTriggered = true;
            window.removeEventListener('scroll', checkScroll);

            // Wait a moment for React to fully render, then find and animate
            setTimeout(() => {
              const checkElement = setInterval(() => {
                if (initTypingEffect()) {
                  clearInterval(checkElement);
                }
              }, 100);

              // Stop checking after 5 seconds
              setTimeout(() => clearInterval(checkElement), 5000);
            }, 100);
          }
        }

        // Wait for page load, then listen for scroll
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('scroll', checkScroll);
          });
        } else {
          window.addEventListener('scroll', checkScroll);
        }
      })();
    </script>

    <!-- Formspree Integration -->
    <script>
      // Wait for React app to load, then modify the contact form
      document.addEventListener('DOMContentLoaded', function() {
        const checkForm = setInterval(function() {
          const form = document.querySelector('form');
          if (form && !form.hasAttribute('data-formspree-modified')) {
            form.setAttribute('data-formspree-modified', 'true');

            // Intercept submit button click instead of form submit
            const submitBtn = form.querySelector('button[type="submit"]');
            if (submitBtn) {
              submitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();

                const formData = new FormData(form);
                const originalText = submitBtn.textContent;

                submitBtn.disabled = true;
                submitBtn.textContent = 'Enviando...';

                fetch('https://formspree.io/f/mqekbekq', {
                  method: 'POST',
                  body: JSON.stringify(Object.fromEntries(formData)),
                  headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                  }
                })
                .then(response => {
                  if (response.ok) {
                    // Clear form fields manually
                    form.querySelectorAll('input, textarea').forEach(el => {
                      el.value = '';
                    });
                    alert('¡Gracias! Su mensaje ha sido enviado.');
                  } else {
                    alert('Error al enviar. Por favor intente de nuevo.');
                  }
                })
                .catch(error => {
                  alert('Error al enviar. Por favor intente de nuevo.');
                })
                .finally(() => {
                  submitBtn.disabled = false;
                  submitBtn.textContent = originalText;
                });

                return false;
              }, true);
            }

            clearInterval(checkForm);
          }
        }, 500);

        setTimeout(() => clearInterval(checkForm), 10000);
      });
    </script>
