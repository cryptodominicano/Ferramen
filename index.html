    <!-- Typing Effect for Hero Text -->
    <script>
      (function() {
        const targetText = "Integrales para tu Negocio";
        let isTyping = false;
        let lastScrollY = 0;
        let typingElement = null;
        let isInitialized = false;

        function findAndPrepareElement() {
          // If already set up, return the existing element
          if (typingElement) return typingElement;

          // Find text node containing the target phrase
          const walker = document.createTreeWalker(
            document.body,
            NodeFilter.SHOW_TEXT,
            null,
            false
          );

          let node;
          while (node = walker.nextNode()) {
            if (node.textContent.includes(targetText)) {
              const parent = node.parentNode;

              // Skip if already processed
              if (parent.classList && parent.classList.contains('typing-container')) {
                typingElement = parent.querySelector('.typing-text');
                return typingElement;
              }

              // Create wrapper span
              const wrapper = document.createElement('span');
              wrapper.className = 'typing-container';

              // Split text around target
              const parts = node.textContent.split(targetText);

              // Create typing span with full text initially
              const typingSpan = document.createElement('span');
              typingSpan.className = 'typing-text';
              typingSpan.setAttribute('data-text', targetText);
              typingSpan.textContent = targetText;

              // Build new content
              if (parts[0]) wrapper.appendChild(document.createTextNode(parts[0]));
              wrapper.appendChild(typingSpan);
              if (parts[1]) wrapper.appendChild(document.createTextNode(parts[1]));

              // Replace original node
              parent.replaceChild(wrapper, node);

              typingElement = typingSpan;
              return typingElement;
            }
          }
          return null;
        }

        function typeText(element, text) {
          if (isTyping) return;
          isTyping = true;

          // Clear existing content
          element.textContent = '';

          let charIndex = 0;

          // Add cursor
          const cursor = document.createElement('span');
          cursor.className = 'cursor';
          element.appendChild(cursor);

          function typeChar() {
            if (charIndex < text.length) {
              // Insert character before cursor
              const charNode = document.createTextNode(text.charAt(charIndex));
              element.insertBefore(charNode, cursor);
              charIndex++;
              setTimeout(typeChar, 60);
            } else {
              // Remove cursor after typing complete
              setTimeout(() => {
                cursor.remove();
                isTyping = false;
              }, 1500);
            }
          }

          typeChar();
        }

        function checkScroll() {
          const currentScrollY = window.scrollY;
          const threshold = 50;

          // Detect crossing the threshold in either direction
          const crossedDown = lastScrollY <= threshold && currentScrollY > threshold;
          const crossedUp = lastScrollY > threshold && currentScrollY <= threshold;

          if ((crossedDown || crossedUp) && !isTyping) {
            const element = findAndPrepareElement();
            if (element) {
              typeText(element, targetText);
            }
          }

          lastScrollY = currentScrollY;
        }

        // Initialize on page load
        function init() {
          if (isInitialized) return;
          isInitialized = true;

          // Wait for React to render
          const checkElement = setInterval(() => {
            if (findAndPrepareElement()) {
              clearInterval(checkElement);
              // Start listening for scroll
              window.addEventListener('scroll', checkScroll);
              lastScrollY = window.scrollY;
            }
          }, 100);

          // Stop checking after 5 seconds
          setTimeout(() => clearInterval(checkElement), 5000);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>

    <!-- Formspree Integration -->
    <script>
      // Wait for React app to load, then modify the contact form
      document.addEventListener('DOMContentLoaded', function() {
        const checkForm = setInterval(function() {
          const form = document.querySelector('form');
          if (form && !form.hasAttribute('data-formspree-modified')) {
            form.setAttribute('data-formspree-modified', 'true');

            // Intercept submit button click instead of form submit
            const submitBtn = form.querySelector('button[type="submit"]');
            if (submitBtn) {
              submitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();

                const formData = new FormData(form);
                const originalText = submitBtn.textContent;

                submitBtn.disabled = true;
                submitBtn.textContent = 'Enviando...';

                fetch('https://formspree.io/f/mqekbekq', {
                  method: 'POST',
                  body: JSON.stringify(Object.fromEntries(formData)),
                  headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                  }
                })
                .then(response => {
                  if (response.ok) {
                    // Clear form fields manually
                    form.querySelectorAll('input, textarea').forEach(el => {
                      el.value = '';
                    });
                    alert('¡Gracias! Su mensaje ha sido enviado.');
                  } else {
                    alert('Error al enviar. Por favor intente de nuevo.');
                  }
                })
                .catch(error => {
                  alert('Error al enviar. Por favor intente de nuevo.');
                })
                .finally(() => {
                  submitBtn.disabled = false;
                  submitBtn.textContent = originalText;
                });

                return false;
              }, true);
            }

            clearInterval(checkForm);
          }
        }, 500);

        setTimeout(() => clearInterval(checkForm), 10000);
      });
    </script>

    <!-- Interactive Map for Contact Section -->
    <script>
      (function() {
        function injectMap() {
          // Find the contact section (look for form or section with contact-related content)
          const contactSection = document.querySelector('#contacto') ||
                                 document.querySelector('[id*="contact"]') ||
                                 document.querySelector('section:has(form)') ||
                                 document.querySelector('form')?.closest('section');

          if (!contactSection) return false;

          // Check if map already exists
          if (document.querySelector('.ferramen-map-container')) return true;

          // Find the form container to place map nearby
          const form = contactSection.querySelector('form');
          const formContainer = form?.parentElement;

          if (!formContainer) return false;

          // Create map container
          const mapContainer = document.createElement('div');
          mapContainer.className = 'ferramen-map-container';
          mapContainer.innerHTML = `
            <div class="map-label">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              Nuestra Ubicación - San Luis, República Dominicana
            </div>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d30267.77774738889!2d-69.55574565!3d18.53648485!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8eaf8604e8d1c1c5%3A0x4c59c6e2a2c6e4e5!2sSan%20Luis%2C%20Dominican%20Republic!5e0!3m2!1sen!2sus!4v1703700000000!5m2!1sen!2sus"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              title="FERRAMEN S.R.L. - San Luis, República Dominicana">
            </iframe>
          `;

          // Insert after the form's parent container
          formContainer.parentElement.insertBefore(mapContainer, formContainer.nextSibling);

          return true;
        }

        // Wait for React to render, then inject map
        const checkSection = setInterval(() => {
          if (injectMap()) {
            clearInterval(checkSection);
          }
        }, 500);

        // Stop checking after 10 seconds
        setTimeout(() => clearInterval(checkSection), 10000);
      })();
    </script>
